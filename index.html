<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evento Interativo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#dff4ff}
body{display:flex;justify-content:center;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100vw,calc(100vh * 941 / 1672));aspect-ratio:941/1672;overflow:hidden;background:#dff4ff}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;z-index:2;border-radius:50%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.debug .hotspot{outline:3px solid red;background:rgba(255,0,0,.18)}
body.editor-mode{background:#111;display:block;padding-bottom:225px}
.editor-mode .stage{margin:0 auto}
.editor-mode .hotspot{border-radius:12px;outline:3px solid #ff3535;background:rgba(255,53,53,.24);touch-action:none;cursor:move}
.editor-mode #fotoBtn{outline-color:#00d9ff;background:rgba(0,217,255,.24)}
.editor-label{display:none;position:absolute;left:6px;top:6px;color:white;background:rgba(0,0,0,.75);padding:5px 7px;border-radius:6px;font:bold 12px Arial;pointer-events:none}
.editor-mode .editor-label{display:block}
.resize-handle{display:none;position:absolute;width:28px;height:28px;right:-11px;bottom:-11px;border-radius:50%;background:white;border:4px solid #111;touch-action:none;cursor:nwse-resize}
.editor-mode .resize-handle{display:block}
#editorPanel{display:none;position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(10,10,10,.97);color:#fff;padding:12px;box-shadow:0 -5px 25px #0008}
.editor-mode #editorPanel{display:block}
.editor-wrap{max-width:760px;margin:auto}.editor-title{font-weight:800;font-size:16px;margin-bottom:6px}.editor-help{font-size:12px;line-height:1.35;opacity:.88;margin-bottom:8px}
#coords{width:100%;min-height:57px;resize:none;border-radius:8px;padding:8px;border:1px solid #555;background:#1d1d1d;color:#9cff9c;font:12px monospace}
.editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.editor-actions button{border:0;border-radius:9px;padding:11px 7px;font-weight:800;cursor:pointer}
#downloadConfig{background:#20c96b;color:#07180d}#copyConfig{background:#eee;color:#111}
</style>
</head>
<body>
<main class="stage" id="stage">
<img class="art" src="assets/tela-inicial.png" alt="Tela inicial">
<a id="fotoBtn" class="hotspot" href="foto.html" aria-label="Moldura para foto"><span class="editor-label">MOLDURA / FOTO</span><span class="resize-handle"></span></a>
<a id="quizBtn" class="hotspot" href="quiz.html" aria-label="Quiz do aniversariante"><span class="editor-label">QUIZ</span><span class="resize-handle"></span></a>
</main>
<section id="editorPanel"><div class="editor-wrap">
<div class="editor-title">Editor visual das áreas clicáveis</div>
<div class="editor-help">Arraste as áreas para posicionar. Use a bolinha branca no canto para redimensionar. Vermelho = Quiz. Azul = Moldura/Foto. Ao terminar, baixe o config.js e substitua o antigo.</div>
<textarea id="coords" readonly></textarea>
<div class="editor-actions"><button id="downloadConfig">Baixar config.js atualizado</button><button id="copyConfig">Copiar posições</button></div>
</div></section>
<script src="config.js"></script>
<script>
const cfg=window.EVENTO_CONFIG||{},botoes=cfg.botoes||{},params=new URLSearchParams(location.search),editor=params.get("editor")==="1";
function aplicarArea(id,a){if(!a)return;const e=document.getElementById(id);e.style.left=a.x+"%";e.style.top=a.y+"%";e.style.width=a.largura+"%";e.style.height=a.altura+"%"}
aplicarArea("fotoBtn",botoes.foto);aplicarArea("quizBtn",botoes.quiz);
if(params.get("debug")==="1")document.getElementById("stage").classList.add("debug");
if(editor){
document.body.classList.add("editor-mode");
const stage=document.getElementById("stage"),foto=document.getElementById("fotoBtn"),quiz=document.getElementById("quizBtn"),coords=document.getElementById("coords");
[foto,quiz].forEach(e=>e.addEventListener("click",x=>x.preventDefault()));
const rnd=n=>Math.round(n*10)/10,pct=(n,t)=>n/t*100;
function area(e){return{x:rnd(parseFloat(e.style.left)),y:rnd(parseFloat(e.style.top)),largura:rnd(parseFloat(e.style.width)),altura:rnd(parseFloat(e.style.height))}}
function output(){cfg.botoes=cfg.botoes||{};cfg.botoes.quiz=area(quiz);cfg.botoes.foto=area(foto);coords.value=`quiz: { x: ${cfg.botoes.quiz.x}, y: ${cfg.botoes.quiz.y}, largura: ${cfg.botoes.quiz.largura}, altura: ${cfg.botoes.quiz.altura} },\nfoto: { x: ${cfg.botoes.foto.x}, y: ${cfg.botoes.foto.y}, largura: ${cfg.botoes.foto.largura}, altura: ${cfg.botoes.foto.altura} }`}
function enable(el){
let s=null;const h=el.querySelector(".resize-handle");
el.addEventListener("pointerdown",e=>{if(e.target===h)return;e.preventDefault();el.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();s={m:"move",sx:e.clientX,sy:e.clientY,l:r.left,t:r.top}});
h.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();h.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();s={m:"resize",sx:e.clientX,sy:e.clientY,w:r.width,h:r.height}});
function move(e){if(!s)return;const sr=stage.getBoundingClientRect();if(s.m==="move"){const er=el.getBoundingClientRect();let l=s.l+(e.clientX-s.sx)-sr.left,t=s.t+(e.clientY-s.sy)-sr.top;l=Math.max(0,Math.min(l,sr.width-er.width));t=Math.max(0,Math.min(t,sr.height-er.height));el.style.left=pct(l,sr.width)+"%";el.style.top=pct(t,sr.height)+"%"}else{const er=el.getBoundingClientRect();let w=Math.max(35,s.w+e.clientX-s.sx),hh=Math.max(35,s.h+e.clientY-s.sy);w=Math.min(w,sr.right-er.left);hh=Math.min(hh,sr.bottom-er.top);el.style.width=pct(w,sr.width)+"%";el.style.height=pct(hh,sr.height)+"%"}output()}
el.addEventListener("pointermove",move);h.addEventListener("pointermove",move);["pointerup","pointercancel"].forEach(t=>{el.addEventListener(t,()=>s=null);h.addEventListener(t,()=>s=null)})}
enable(foto);enable(quiz);output();
document.getElementById("copyConfig").onclick=async()=>{await navigator.clipboard.writeText(coords.value);const b=document.getElementById("copyConfig"),o=b.textContent;b.textContent="Copiado!";setTimeout(()=>b.textContent=o,1200)};
document.getElementById("downloadConfig").onclick=()=>{output();const txt="// CONFIGURAÇÃO GERADA PELO EDITOR VISUAL\nwindow.EVENTO_CONFIG = "+JSON.stringify(cfg,null,2)+";\n",blob=new Blob([txt],{type:"text/javascript;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="config.js";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
}
</script>
</body></html>
